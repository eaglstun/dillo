<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="AppleTitle" content="Keyboard shortcuts">
<title>Keyboard shortcuts</title>
</head>
<body>
<h1>Keyboard shortcuts</h1>
<p>Menu commands use the Command key. Dillo's own bindings, set in
<code>~/.dillo/keysrc</code>, use Control.</p>
<table>
<tr><th>Shortcut</th><th>Action</th></tr>
<tr><td>Command-T</td><td>New tab</td></tr>
<tr><td>Command-N</td><td>New window</td></tr>
<tr><td>Command-O</td><td>Open file</td></tr>
<tr><td>Command-L</td><td>Open location</td></tr>
<tr><td>Command-W</td><td>Close tab</td></tr>
<tr><td>Control-F</td><td>Find text on the page</td></tr>
<tr><td>Control-R</td><td>Reload the page</td></tr>
</table>
</body>
</html>
