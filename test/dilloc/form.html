<!DOCTYPE html>
<html>
<head>
<title>dilloc form test</title>
</head>
<body>
<h1>dilloc form test</h1>
<p>
Links: <a href="form-target.html">relative</a>,
<a href="https://example.com/x">absolute</a>,
<a href="#anchor">fragment</a>.
</p>

<form method="get" action="form-target.html">
<p>Text: <input type="text" name="q" value="initial"></p>
<p>Password: <input type="password" name="pw"></p>
<p>Checkbox: <input type="checkbox" name="opt" value="yes"> opt</p>
<p>Radio:
<input type="radio" name="color" value="red"> red
<input type="radio" name="color" value="green" checked> green
<input type="radio" name="color" value="blue"> blue
</p>
<p>Select:
<select name="size">
<option value="s">small</option>
<option value="m" selected>medium</option>
<option value="l">large</option>
</select>
</p>
<p>Textarea: <textarea name="note">first line</textarea></p>
<input type="hidden" name="token" value="t0k3n">
<p>
<input type="submit" name="btn1" value="One">
<input type="submit" name="btn2" value="Two">
<input type="reset" value="Reset">
</p>
</form>

<form method="post" action="form-target.html" enctype="multipart/form-data">
<p><input type="text" name="comment" value=""></p>
<!-- Dillo only creates file inputs inside multipart POST forms -->
<p>File: <input type="file" name="upload"></p>
<p><input type="submit" name="post" value="Post"></p>
</form>

<p id="anchor">Anchor target.</p>
</body>
</html>
