<!DOCTYPE html>
<html>
<head>
<title>Test percentage margin and padding</title>
<style>
  body { margin: 0 }
  .box { width: 400px; background: #ddd }
  .pad { padding: 0 10%; background: lightgreen }
  .mar { margin: 5% 25% 0 5%; background: lightblue }
  .both { max-width: 300px; padding: 2% 5%; background: pink }
</style>
</head>
<body>
<div class="box">
  <div class="pad">Padding of 10% on each side of a 400px wide box.</div>
  <div class="mar">A 5% left and 25% right margin in a 400px box.</div>
  <div class="both">Shorthand percentages, capped by max-width.</div>
</div>
</body>
</html>
