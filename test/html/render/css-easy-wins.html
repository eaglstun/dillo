<!DOCTYPE html>
<html>
  <head>
    <title>Test easy CSS wins</title>
    <style>
      body { margin: 20px; }
      .none {
        text-decoration: underline;
        text-decoration: none;
      }
      .transparent {
        background-color: red;
        background-color: transparent;
      }
      .aligned { width: 240px; }
      .start { text-align: start; }
      .end { text-align: end; }
    </style>
  </head>
  <body>
    <div class="none">No decoration</div>
    <div class="transparent">Transparent background</div>
    <div class="aligned start">Start aligned</div>
    <div class="aligned end">End aligned</div>
  </body>
</html>
